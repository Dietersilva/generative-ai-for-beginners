name: Lock closed issue

# Disabled for this fork: inherited from microsoft/generative-ai-for-beginners.
# Runs only when started by hand (Actions tab > Run workflow).
# To re-enable, restore the original trigger from git history.
on:
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
    - uses: OSDKDev/lock-issues@v1.1
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
