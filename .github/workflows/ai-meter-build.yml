name: AI-Meter Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - "ai-meter/**"
      - ".github/workflows/ai-meter-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only to publish the installer on the "ai-meter-latest" release
    defaults:
      run:
        working-directory: ai-meter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build AI-Meter (tests + app folder)
        shell: pwsh
        run: ./build.ps1
      - name: Build installer (AI-Meter-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
          & $iscc installer\AI-Meter.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          $hash = (Get-FileHash dist\AI-Meter-Setup.exe -Algorithm SHA256).Hash
          "SHA256 AI-Meter-Setup.exe: $hash"
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AI-Meter-windows
          path: |
            ai-meter/dist/AI-Meter-Setup.exe
            ai-meter/dist/AI-Meter-package/
          retention-days: 30
      - name: Publish installer to the "ai-meter-latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ai-meter-latest --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY 2>$null
          $notes = "AI-Meter installer built by GitHub Actions from commit $env:GITHUB_SHA.`n`nSHA-256: $env:SETUP_SHA256"
          gh release create ai-meter-latest dist/AI-Meter-Setup.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AI-Meter (latest build)" --notes $notes
