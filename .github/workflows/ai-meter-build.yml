name: AI-Meter Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - "ai-meter/**"
      - ".github/workflows/ai-meter-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai-meter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build AI-Meter.exe
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Meter-windows
          path: ai-meter/dist/AI-Meter-package/
          retention-days: 30
