name: AI-Meter Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - "ai-meter/**"
      - ".github/workflows/ai-meter-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai-meter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build AI-Meter.exe
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AI-Meter-windows
          path: ai-meter/dist/AI-Meter-package/
          retention-days: 30
